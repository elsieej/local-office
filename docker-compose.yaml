services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: local_office
      POSTGRES_PASSWORD: local_office
      POSTGRES_DB: local_office
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U local_office -d local_office']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
